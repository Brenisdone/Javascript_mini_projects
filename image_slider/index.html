<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image_Slider</title>
    <link rel="Stylesheet" href="style.css">
</head>
<body>
    <div class="banner">
        Classy
    </div>
    <div class="slider">
        <div class="slides">
            <img class="slide" src="blazers/blazer1.jpg" alt="Blazer #1" height="512px">
            <img class="slide" src="blazers/blazer2.jpg" alt="Blazer #2" height="512px">
            <img class="slide" src="blazers/blazer3.jpg" alt="Blazer #3" height="512px">
        </div>
        <div>
        <div>
        <button class="prev" onclick="prevSlide()">&#10094</button>
        <button class="next" onclick="nextSlide()">&#10095</button>
        <script src="index.js"></script>
    </div>
    <div class="sale">
        Summer Sale<br>50% off
    </div>
</body>
</html>
